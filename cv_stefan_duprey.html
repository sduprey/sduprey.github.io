<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            color: #333;
        }

        .link-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        a.button-link {
            text-decoration: none;
            background-color: #007acc;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            transition: background-color 0.3s, transform 0.2s;
        }

        a.button-link:hover {
            background-color: #005f99;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>My Pages</h1>
    <div class="link-container">
        <a href="https://sduprey.github.io/Intro_sd.html" class="button-link" target="_blank">Introduction</a>
        <a href="https://sduprey.github.io/experience_sd.html" class="button-link" target="_blank">Experience</a>
        <a href="https://sduprey.github.io/skills_sd.html" class="button-link" target="_blank">Skills</a>
    </div>
</body>
</html>
